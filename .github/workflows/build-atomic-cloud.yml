name: Build atomic cloud loading artifacts

on:
  push:
    branches: [fix/atomic-cloud-loading]
    paths: [.github/workflows/build-atomic-cloud.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.90.0
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
      - run: npm run wasm:build
      - run: npm run wasm:test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run sandbox:build
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-cloud-artifacts
          path: |
            src/wasm-backend/generated
            dist
          retention-days: 3
