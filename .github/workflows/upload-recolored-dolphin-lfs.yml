name: Upload recolored dolphin LFS object

on:
  push:
    branches:
      - feat/gaussian-store
    paths:
      - .github/workflows/upload-recolored-dolphin-lfs.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Recreate and upload the LFS object
        run: |
          git lfs install --local
          curl --fail --location \
            --output /tmp/dolphins_colored.ply \
            https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/ply/ascii/dolphins_colored.ply
          python scripts/generate_dolphins_3dgs.py \
            /tmp/dolphins_colored.ply \
            sandbox/public/assets/dolphins-colored-3dgs.ply
          git add --renormalize sandbox/public/assets/dolphins-colored-3dgs.ply
          git lfs push --object-id origin \
            4a83fc006f0dfa4918d6e4e7ac74e092fb86d31df6548a084a7c9a430ffcc5ef
