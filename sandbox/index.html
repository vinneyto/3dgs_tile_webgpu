<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DGS WebGPU sandbox</title>
  </head>
  <body>
    <main id="viewport"></main>
    <section id="hud">
      <strong>3DGS WebGPU sandbox</strong>
      <span id="status">Starting WebGPU…</span>
      <button id="open-ply" type="button">Open cloud</button>
      <input
        id="ply-file"
        type="file"
        accept=".ply,.splat,.ksplat,.spz,.sog,.sogs,.rad"
        hidden
      />
      <small
        >Orbit: drag · Focus: click · Zoom: wheel · Drop a Gaussian cloud</small
      >
      <details id="spatial-debug">
        <summary>Mipmap visualization</summary>
        <label>
          <input id="show-octree" type="checkbox" />
          Mipmap bounds
        </label>
        <label>
          <input id="color-splats-by-lod" type="checkbox" />
          Color splats by mipmap depth
        </label>
        <div class="lod-palette" aria-label="Mipmap color palette">
          <span data-lod-color="0">Depth 0</span>
          <span data-lod-color="1">Depth 1</span>
          <span data-lod-color="2">Depth 2</span>
        </div>
      </details>
      <details id="renderer-diagnostics" open>
        <summary>Renderer diagnostics</summary>
        <pre id="metrics" aria-label="WebGPU diagnostics"></pre>
      </details>
      <details id="kernel-profile">
        <summary>Kernel timings</summary>
        <pre id="kernel-timings" aria-label="WebGPU kernel timings"></pre>
      </details>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
