[workspace]
members = ["gaussian-backend", "vendor/spark-lib"]
resolver = "2"

[workspace.package]
rust-version = "1.88"
edition = "2021"
license = "MIT"
authors = ["World Labs Technologies", "3dgs_tile_webgpu contributors"]
repository = "https://github.com/vinneyto/3dgs_tile_webgpu"

[workspace.dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["std", "compile-time-rng"] }
anyhow = "1.0"
glam = "0.30.8"
half = { version = "2.6", features = ["std"] }
itertools = "0.14"
js-sys = "=0.3.77"
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "0.6.5"
miniz_oxide = "0.8"
ordered-float = "5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
zip = { version = "7", default-features = false, features = ["deflate"] }
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
hnsw = "0.11"
rand_pcg = "0.3"
space = { version = "0.17", default-features = false, features = ["alloc"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
